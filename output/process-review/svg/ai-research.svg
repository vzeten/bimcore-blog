<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Исследовать: плагин, конкуренты, сайты">
<defs><marker id="ai-research-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="1100" height="370" fill="#ffffff"/>
<path d="M 268 92.5 L 282 92.5 L 282 103.5 L 296 103.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-research-arr)"/>
<path d="M 536 103.5 L 550 103.5 L 550 94.5 L 564 94.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-research-arr)"/>
<path d="M 804 94.5 L 818 94.5 L 818 83.5 L 832 83.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-research-arr)"/>
<path d="M 952 123 L 952 223.4" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ai-research-arr)"/>
<rect x="28" y="44" width="240" height="97" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="148" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы просите изучить</text>
<text x="148" y="89" text-anchor="middle" font-size="14" fill="#3a4550">код существующего плагина,</text>
<text x="148" y="107" text-anchor="middle" font-size="14" fill="#3a4550">сайты конкурентов, наш</text>
<text x="148" y="125" text-anchor="middle" font-size="14" fill="#3a4550">раздел</text>
<rect x="296" y="44" width="240" height="119" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="306" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="332.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="416" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Помощник находит доступ</text>
<text x="416" y="109" text-anchor="middle" font-size="14" fill="#3a4550">папку с кодом или адреса</text>
<text x="416" y="127" text-anchor="middle" font-size="14" fill="#3a4550">страниц; если доступа нет —</text>
<text x="416" y="145" text-anchor="middle" font-size="14" fill="#3a4550">говорит, что читать нечего</text>
<rect x="564" y="44" width="240" height="101" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="574" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="600.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="684" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Изучает, ничего не меняя</text>
<text x="684" y="109" text-anchor="middle" font-size="14" fill="#3a4550">файлы не правятся, проекты</text>
<text x="684" y="127" text-anchor="middle" font-size="14" fill="#3a4550">и папки не создаются</text>
<rect x="832" y="44" width="240" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="952" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Выводы вам</text>
<text x="952" y="89" text-anchor="middle" font-size="14" fill="#3a4550">что есть, что рискованно,</text>
<text x="952" y="107" text-anchor="middle" font-size="14" fill="#3a4550">что стоит спросить</text>
<rect x="832" y="223.4" width="240" height="118" rx="10" fill="#fbeadd" stroke="#b4541a" stroke-width="2"/>
<text x="952" y="247.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Разработка — только</text>
<text x="952" y="268.4" text-anchor="middle" font-weight="700" fill="#1f2a33">отдельным поручением</text>
<text x="952" y="289.4" text-anchor="middle" font-size="14" fill="#3a4550">место для кода готовит</text>
<text x="952" y="307.4" text-anchor="middle" font-size="14" fill="#3a4550">помощник после него; GitHub</text>
<text x="952" y="325.4" text-anchor="middle" font-size="14" fill="#3a4550">— отдельное согласие</text>
</svg>