<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 367" width="1100" height="367" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Картинки в статьях">
<defs><marker id="blog-media-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="1100" height="367" fill="#ffffff"/>
<path d="M 268 105 L 296 103.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-media-arr)"/>
<path d="M 536 103.5 L 550 103.5 L 550 123 L 564 123" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#blog-media-arr)"/>
<rect x="28" y="44" width="240" height="122" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="148" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Картинка попадает в</text>
<text x="148" y="109" text-anchor="middle" font-weight="700" fill="#1f2a33">статью</text>
<text x="148" y="130" text-anchor="middle" font-size="14" fill="#3a4550">вставка в редакторе или</text>
<text x="148" y="148" text-anchor="middle" font-size="14" fill="#3a4550">импорт из Word</text>
<rect x="296" y="44" width="240" height="119" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="306" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="332.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="416" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Рядом с index.mdx</text>
<text x="416" y="109" text-anchor="middle" font-size="14" fill="#3a4550">своя копия у каждого языка;</text>
<text x="416" y="127" text-anchor="middle" font-size="14" fill="#3a4550">при вставке байты не</text>
<text x="416" y="145" text-anchor="middle" font-size="14" fill="#3a4550">меняются</text>
<rect x="564" y="44" width="240" height="158" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="574" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="600.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="684" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Обработка один раз, до</text>
<text x="684" y="109" text-anchor="middle" font-weight="700" fill="#1f2a33">публикации</text>
<text x="684" y="130" text-anchor="middle" font-size="14" fill="#3a4550">шире 1100 px → 1100;</text>
<text x="684" y="148" text-anchor="middle" font-size="14" fill="#3a4550">скриншот → PNG, фото и</text>
<text x="684" y="166" text-anchor="middle" font-size="14" fill="#3a4550">градиент → JPEG; оригинал</text>
<text x="684" y="184" text-anchor="middle" font-size="14" fill="#3a4550">сохранить</text>
<rect x="832" y="44" width="240" height="101" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="842" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="868.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="952" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Форматы и вес</text>
<text x="952" y="109" text-anchor="middle" font-size="14" fill="#3a4550">GIF до 5 МБ; WebM до 10 МБ;</text>
<text x="952" y="127" text-anchor="middle" font-size="14" fill="#3a4550">для PNG/JPG вес — подсказка</text>
<rect x="28" y="237.2" width="460" height="79" rx="10" fill="#fbeadd" stroke="#b4541a" stroke-width="2"/>
<text x="258" y="261.2" text-anchor="middle" font-weight="700" fill="#1f2a33">Оригинал сохранить до обработки</text>
<text x="258" y="282.2" text-anchor="middle" font-size="14" fill="#3a4550">Word — в новую пустую папку; image-prep — на копиях</text>
<text x="258" y="300.2" text-anchor="middle" font-size="14" fill="#3a4550">картинок. Скрипты сами опасный запуск не запрещают</text>
<rect x="564" y="237.2" width="460" height="101" rx="10" fill="#fff6d6" stroke="#b8860b" stroke-width="2"/>
<rect x="574" y="245.2" width="52.96" height="18" rx="9" fill="#b8860b"/>
<text x="600.48" y="258.2" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Пробел</text>
<text x="794" y="281.2" text-anchor="middle" font-weight="700" fill="#1f2a33">Программа пока не умеет</text>
<text x="794" y="302.2" text-anchor="middle" font-size="14" fill="#3a4550">сейчас только PNG и повторная обработка; выбор формата</text>
<text x="794" y="320.2" text-anchor="middle" font-size="14" fill="#3a4550">и запрет для опубликованных — задача #72</text>
</svg>