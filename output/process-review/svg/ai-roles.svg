<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 411" width="1100" height="411" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Кто что делает">
<defs><marker id="ai-roles-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="1100" height="411" fill="#ffffff"/>
<path d="M 268 83.5 L 282 83.5 L 282 103.5 L 296 103.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-roles-arr)"/>
<path d="M 416 163 L 416 209.6" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ai-roles-arr)"/>
<path d="M 536 103.5 L 564 103.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-roles-arr)"/>
<path d="M 804 103.5 L 818 103.5 L 818 110.5 L 832 110.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-roles-arr)"/>
<path d="M 684 163 L 684 209.6" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ai-roles-arr)"/>
<path d="M 804 287.1 L 818 287.1 L 818 110.5 L 832 110.5" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ai-roles-arr)"/>
<rect x="28" y="44" width="240" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="148" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы ставите задачу</text>
<text x="148" y="89" text-anchor="middle" font-size="14" fill="#3a4550">своими словами, в нужном</text>
<text x="148" y="107" text-anchor="middle" font-size="14" fill="#3a4550">месте</text>
<rect x="296" y="44" width="240" height="119" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="306" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="332.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="416" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Ведущая видимая сессия</text>
<text x="416" y="109" text-anchor="middle" font-size="14" fill="#3a4550">та, куда вы написали;</text>
<text x="416" y="127" text-anchor="middle" font-size="14" fill="#3a4550">отвечает за доведение до</text>
<text x="416" y="145" text-anchor="middle" font-size="14" fill="#3a4550">результата</text>
<rect x="296" y="209.6" width="240" height="173" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="306" y="217.6" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="332.48" y="230.6" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="416" y="253.6" text-anchor="middle" font-weight="700" fill="#1f2a33">Менеджер</text>
<text x="416" y="274.6" text-anchor="middle" font-size="14" fill="#3a4550">чат «Менеджер проекта» или</text>
<text x="416" y="292.6" text-anchor="middle" font-size="14" fill="#3a4550">разовый агент; только новая</text>
<text x="416" y="310.6" text-anchor="middle" font-size="14" fill="#3a4550">или расширенная работа по</text>
<text x="416" y="328.6" text-anchor="middle" font-size="14" fill="#3a4550">редактору; итог возвращает</text>
<text x="416" y="346.6" text-anchor="middle" font-size="14" fill="#3a4550">ведущей сессии; ведущим сам</text>
<text x="416" y="364.6" text-anchor="middle" font-size="14" fill="#3a4550">не становится</text>
<rect x="564" y="44" width="240" height="119" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="574" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="600.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="684" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Исполнитель</text>
<text x="684" y="109" text-anchor="middle" font-size="14" fill="#3a4550">статья: та же сессия · код</text>
<text x="684" y="127" text-anchor="middle" font-size="14" fill="#3a4550">редактора: Claude, при его</text>
<text x="684" y="145" text-anchor="middle" font-size="14" fill="#3a4550">лимите замена по правилу</text>
<rect x="564" y="209.6" width="240" height="155" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="574" y="217.6" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="600.48" y="230.6" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="684" y="253.6" text-anchor="middle" font-weight="700" fill="#1f2a33">Проверяет другая система</text>
<text x="684" y="274.6" text-anchor="middle" font-size="14" fill="#3a4550">Codex ↔ Claude: общие</text>
<text x="684" y="292.6" text-anchor="middle" font-size="14" fill="#3a4550">правила, процессы,</text>
<text x="684" y="310.6" text-anchor="middle" font-size="14" fill="#3a4550">хранение, публикация и</text>
<text x="684" y="328.6" text-anchor="middle" font-size="14" fill="#3a4550">массовые изменения; без</text>
<text x="684" y="346.6" text-anchor="middle" font-size="14" fill="#3a4550">повторения всей работы</text>
<rect x="832" y="44" width="240" height="133" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="952" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы смотрите и решаете</text>
<text x="952" y="89" text-anchor="middle" font-size="14" fill="#3a4550">статья приходит к вам</text>
<text x="952" y="107" text-anchor="middle" font-size="14" fill="#3a4550">сразу; код — после</text>
<text x="952" y="125" text-anchor="middle" font-size="14" fill="#3a4550">контроля. Принимаете,</text>
<text x="952" y="143" text-anchor="middle" font-size="14" fill="#3a4550">разрешаете публикацию или</text>
<text x="952" y="161" text-anchor="middle" font-size="14" fill="#3a4550">называете, что не так</text>
<rect x="348.52" y="176.3" width="134.96" height="20" rx="4" fill="#ffffff" stroke="#e1e5ea"/>
<text x="416" y="190.3" text-anchor="middle" font-size="12" fill="#3a4550">отбор новой работы</text>
</svg>