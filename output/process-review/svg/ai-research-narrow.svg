<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 888" width="288" height="888" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Исследовать: плагин, конкуренты, сайты">
<defs><marker id="ai-research-v-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="288" height="888" fill="#ffffff"/>
<path d="M 144 141 L 144 214" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-research-v-arr)"/>
<path d="M 144 351 L 144 384" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-research-v-arr)"/>
<path d="M 144 506 L 144 554" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-research-v-arr)"/>
<path d="M 144 633 L 144 724" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ai-research-v-arr)"/>
<rect x="28" y="44" width="232" height="97" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="144" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы просите изучить</text>
<text x="144" y="89" text-anchor="middle" font-size="14" fill="#3a4550">код существующего плагина,</text>
<text x="144" y="107" text-anchor="middle" font-size="14" fill="#3a4550">сайты конкурентов, наш</text>
<text x="144" y="125" text-anchor="middle" font-size="14" fill="#3a4550">раздел</text>
<rect x="28" y="214" width="232" height="137" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="222" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="258" text-anchor="middle" font-weight="700" fill="#1f2a33">Помощник находит доступ</text>
<text x="144" y="279" text-anchor="middle" font-size="14" fill="#3a4550">папку с кодом или адреса</text>
<text x="144" y="297" text-anchor="middle" font-size="14" fill="#3a4550">страниц; если доступа нет</text>
<text x="144" y="315" text-anchor="middle" font-size="14" fill="#3a4550">— говорит, что читать</text>
<text x="144" y="333" text-anchor="middle" font-size="14" fill="#3a4550">нечего</text>
<rect x="28" y="384" width="232" height="122" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="392" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="428" text-anchor="middle" font-weight="700" fill="#1f2a33">Изучает, ничего не</text>
<text x="144" y="449" text-anchor="middle" font-weight="700" fill="#1f2a33">меняя</text>
<text x="144" y="470" text-anchor="middle" font-size="14" fill="#3a4550">файлы не правятся, проекты</text>
<text x="144" y="488" text-anchor="middle" font-size="14" fill="#3a4550">и папки не создаются</text>
<rect x="28" y="554" width="232" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="144" y="578" text-anchor="middle" font-weight="700" fill="#1f2a33">Выводы вам</text>
<text x="144" y="599" text-anchor="middle" font-size="14" fill="#3a4550">что есть, что рискованно,</text>
<text x="144" y="617" text-anchor="middle" font-size="14" fill="#3a4550">что стоит спросить</text>
<rect x="28" y="724" width="232" height="136" rx="10" fill="#fbeadd" stroke="#b4541a" stroke-width="2"/>
<text x="144" y="748" text-anchor="middle" font-weight="700" fill="#1f2a33">Разработка — только</text>
<text x="144" y="769" text-anchor="middle" font-weight="700" fill="#1f2a33">отдельным поручением</text>
<text x="144" y="790" text-anchor="middle" font-size="14" fill="#3a4550">место для кода готовит</text>
<text x="144" y="808" text-anchor="middle" font-size="14" fill="#3a4550">помощник после него;</text>
<text x="144" y="826" text-anchor="middle" font-size="14" fill="#3a4550">GitHub — отдельное</text>
<text x="144" y="844" text-anchor="middle" font-size="14" fill="#3a4550">согласие</text>
</svg>