<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 1144" width="516" height="1144" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Как ведётся база">
<defs><marker id="ai-base-v-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="516" height="1144" fill="#ffffff"/>
<path d="M 144 163 L 144 214" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-base-v-arr)"/>
<path d="M 144 351 L 144 384" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-base-v-arr)"/>
<path d="M 144 524 L 144 554" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ai-base-v-arr)"/>
<rect x="28" y="44" width="232" height="119" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Новые записи</text>
<text x="144" y="109" text-anchor="middle" font-size="14" fill="#3a4550">идея, факт, решение —</text>
<text x="144" y="127" text-anchor="middle" font-size="14" fill="#3a4550">сразу во входящие базы, с</text>
<text x="144" y="145" text-anchor="middle" font-size="14" fill="#3a4550">датой и автором</text>
<rect x="28" y="214" width="232" height="137" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="222" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="258" text-anchor="middle" font-weight="700" fill="#1f2a33">Сверка с принятым</text>
<text x="144" y="279" text-anchor="middle" font-size="14" fill="#3a4550">старое предложение не</text>
<text x="144" y="297" text-anchor="middle" font-size="14" fill="#3a4550">отменяет новое решение;</text>
<text x="144" y="315" text-anchor="middle" font-size="14" fill="#3a4550">догадка помощника не</text>
<text x="144" y="333" text-anchor="middle" font-size="14" fill="#3a4550">отменяет ваше</text>
<rect x="28" y="384" width="232" height="140" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="392" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="428" text-anchor="middle" font-weight="700" fill="#1f2a33">Сохранить нужное,</text>
<text x="144" y="449" text-anchor="middle" font-weight="700" fill="#1f2a33">убрать дубль</text>
<text x="144" y="470" text-anchor="middle" font-size="14" fill="#3a4550">обратимо: исходная строка</text>
<text x="144" y="488" text-anchor="middle" font-size="14" fill="#3a4550">остаётся, пока размещение</text>
<text x="144" y="506" text-anchor="middle" font-size="14" fill="#3a4550">не подтверждено</text>
<rect x="28" y="554" width="232" height="97" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="144" y="578" text-anchor="middle" font-weight="700" fill="#1f2a33">Конфликт — вам</text>
<text x="144" y="599" text-anchor="middle" font-size="14" fill="#3a4550">только при неясности, один</text>
<text x="144" y="617" text-anchor="middle" font-size="14" fill="#3a4550">вопрос; обе записи</text>
<text x="144" y="635" text-anchor="middle" font-size="14" fill="#3a4550">сохраняются</text>
<rect x="28" y="724" width="460" height="101" rx="10" fill="#fff6d6" stroke="#b8860b" stroke-width="2"/>
<rect x="38" y="732" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="745" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="258" y="768" text-anchor="middle" font-weight="700" fill="#1f2a33">Старые входящие</text>
<text x="258" y="789" text-anchor="middle" font-size="14" fill="#3a4550">процессные записи разобраны; остаток других тем —</text>
<text x="258" y="807" text-anchor="middle" font-size="14" fill="#3a4550">отдельная работа; ночной автоматики нет</text>
<rect x="28" y="979" width="460" height="137" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="987" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="1000" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="258" y="1023" text-anchor="middle" font-weight="700" fill="#1f2a33">Git — история заметок на компьютере</text>
<text x="258" y="1044" text-anchor="middle" font-size="14" fill="#3a4550">Планировщик Windows сохраняет изменения каждые 15</text>
<text x="258" y="1062" text-anchor="middle" font-size="14" fill="#3a4550">минут. Ветка obsidan-main. GitHub запрещён. ИИ могут</text>
<text x="258" y="1080" text-anchor="middle" font-size="14" fill="#3a4550">читать прошлые версии; восстановление — с вашего</text>
<text x="258" y="1098" text-anchor="middle" font-size="14" fill="#3a4550">разрешения.</text>
</svg>