<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 1074" width="516" height="1074" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Картинки в статьях">
<defs><marker id="blog-media-v-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="516" height="1074" fill="#ffffff"/>
<path d="M 144 166 L 144 214" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-media-v-arr)"/>
<path d="M 144 333 L 144 384" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#blog-media-v-arr)"/>
<rect x="28" y="44" width="232" height="122" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Картинка попадает в</text>
<text x="144" y="109" text-anchor="middle" font-weight="700" fill="#1f2a33">статью</text>
<text x="144" y="130" text-anchor="middle" font-size="14" fill="#3a4550">вставка в редакторе или</text>
<text x="144" y="148" text-anchor="middle" font-size="14" fill="#3a4550">импорт из Word</text>
<rect x="28" y="214" width="232" height="119" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="222" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="258" text-anchor="middle" font-weight="700" fill="#1f2a33">Рядом с index.mdx</text>
<text x="144" y="279" text-anchor="middle" font-size="14" fill="#3a4550">своя копия у каждого</text>
<text x="144" y="297" text-anchor="middle" font-size="14" fill="#3a4550">языка; при вставке байты</text>
<text x="144" y="315" text-anchor="middle" font-size="14" fill="#3a4550">не меняются</text>
<rect x="28" y="384" width="232" height="158" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="392" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="428" text-anchor="middle" font-weight="700" fill="#1f2a33">Обработка один раз, до</text>
<text x="144" y="449" text-anchor="middle" font-weight="700" fill="#1f2a33">публикации</text>
<text x="144" y="470" text-anchor="middle" font-size="14" fill="#3a4550">шире 1100 px → 1100;</text>
<text x="144" y="488" text-anchor="middle" font-size="14" fill="#3a4550">скриншот → PNG, фото и</text>
<text x="144" y="506" text-anchor="middle" font-size="14" fill="#3a4550">градиент → JPEG; оригинал</text>
<text x="144" y="524" text-anchor="middle" font-size="14" fill="#3a4550">сохранить</text>
<rect x="28" y="554" width="232" height="119" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="562" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="575" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="598" text-anchor="middle" font-weight="700" fill="#1f2a33">Форматы и вес</text>
<text x="144" y="619" text-anchor="middle" font-size="14" fill="#3a4550">GIF до 5 МБ; WebM до 10</text>
<text x="144" y="637" text-anchor="middle" font-size="14" fill="#3a4550">МБ; для PNG/JPG вес —</text>
<text x="144" y="655" text-anchor="middle" font-size="14" fill="#3a4550">подсказка</text>
<rect x="28" y="724" width="460" height="79" rx="10" fill="#fbeadd" stroke="#b4541a" stroke-width="2"/>
<text x="258" y="748" text-anchor="middle" font-weight="700" fill="#1f2a33">Оригинал сохранить до обработки</text>
<text x="258" y="769" text-anchor="middle" font-size="14" fill="#3a4550">Word — в новую пустую папку; image-prep — на копиях</text>
<text x="258" y="787" text-anchor="middle" font-size="14" fill="#3a4550">картинок. Скрипты сами опасный запуск не запрещают</text>
<rect x="28" y="945" width="460" height="101" rx="10" fill="#fff6d6" stroke="#b8860b" stroke-width="2"/>
<rect x="38" y="953" width="52.96" height="18" rx="9" fill="#b8860b"/>
<text x="64.48" y="966" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Пробел</text>
<text x="258" y="989" text-anchor="middle" font-weight="700" fill="#1f2a33">Программа пока не умеет</text>
<text x="258" y="1010" text-anchor="middle" font-size="14" fill="#3a4550">сейчас только PNG и повторная обработка; выбор формата</text>
<text x="258" y="1028" text-anchor="middle" font-size="14" fill="#3a4550">и запрет для опубликованных — задача #72</text>
</svg>