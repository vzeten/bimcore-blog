<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 1196" width="516" height="1196" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Где статьи и как они доходят до сайта">
<defs><marker id="blog-articles-v-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="516" height="1196" fill="#ffffff"/>
<path d="M 144 123 L 144 214" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-articles-v-arr)"/>
<path d="M 144 336 L 144 384" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-articles-v-arr)"/>
<path d="M 144 503 L 144 554" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-articles-v-arr)"/>
<path d="M 144 655 L 144 724" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-articles-v-arr)"/>
<path d="M 144 803 L 144 894" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-articles-v-arr)"/>
<rect x="28" y="44" width="232" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="144" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы просите статью</text>
<text x="144" y="89" text-anchor="middle" font-size="14" fill="#3a4550">написать, поправить,</text>
<text x="144" y="107" text-anchor="middle" font-size="14" fill="#3a4550">перевести</text>
<rect x="28" y="214" width="232" height="122" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="222" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="258" text-anchor="middle" font-weight="700" fill="#1f2a33">Исполнитель пишет файл</text>
<text x="144" y="279" text-anchor="middle" font-weight="700" fill="#1f2a33">на место</text>
<text x="144" y="300" text-anchor="middle" font-size="14" fill="#3a4550">если окно редактора</text>
<text x="144" y="318" text-anchor="middle" font-size="14" fill="#3a4550">закрыто, сам его открывает</text>
<rect x="28" y="384" width="232" height="119" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="392" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="428" text-anchor="middle" font-weight="700" fill="#1f2a33">Файл в рабочей папке</text>
<text x="144" y="449" text-anchor="middle" font-size="14" fill="#3a4550">C:\My_code\bimcore-blog ·</text>
<text x="144" y="467" text-anchor="middle" font-size="14" fill="#3a4550">blog\ · docs\ · i18n\ ·</text>
<text x="144" y="485" text-anchor="middle" font-size="14" fill="#3a4550">ветка main</text>
<rect x="28" y="554" width="232" height="101" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="562" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="575" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="598" text-anchor="middle" font-weight="700" fill="#1f2a33">Окно редактора</text>
<text x="144" y="619" text-anchor="middle" font-size="14" fill="#3a4550">localhost:4780; читает</text>
<text x="144" y="637" text-anchor="middle" font-size="14" fill="#3a4550">статьи из рабочей папки</text>
<rect x="28" y="724" width="232" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="144" y="748" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы смотрите и правите</text>
<text x="144" y="769" text-anchor="middle" font-size="14" fill="#3a4550">по ссылке на статью в окне</text>
<text x="144" y="787" text-anchor="middle" font-size="14" fill="#3a4550">редактора</text>
<rect x="28" y="894" width="232" height="115" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="144" y="918" text-anchor="middle" font-weight="700" fill="#1f2a33">Разрешаете публикацию</text>
<text x="144" y="939" text-anchor="middle" font-size="14" fill="#3a4550">кнопкой или словами</text>
<text x="144" y="957" text-anchor="middle" font-size="14" fill="#3a4550">«опубликуй: …»; без</text>
<text x="144" y="975" text-anchor="middle" font-size="14" fill="#3a4550">разрешения на сайт ничего</text>
<text x="144" y="993" text-anchor="middle" font-size="14" fill="#3a4550">не уходит</text>
<rect x="28" y="1064" width="460" height="104" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="1072" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="1085" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="258" y="1108" text-anchor="middle" font-weight="700" fill="#1f2a33">Состояние статьи: скрыта · по ссылке · видна</text>
<text x="258" y="1129" text-anchor="middle" font-weight="700" fill="#1f2a33">всем</text>
<text x="258" y="1150" text-anchor="middle" font-size="14" fill="#3a4550">меняется только по вашему указанию</text>
</svg>