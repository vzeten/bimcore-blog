<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 516 1193" width="516" height="1193" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Лимит или новый чат">
<defs><marker id="ai-continue-v-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="516" height="1193" fill="#ffffff"/>
<path d="M 144 108 L 144 214" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-continue-v-arr)"/>
<path d="M 144 329 L 144 384" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-continue-v-arr)"/>
<path d="M 144 463 L 144 554" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-continue-v-arr)"/>
<path d="M 144 690 L 144 724" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-continue-v-arr)"/>
<rect x="28" y="44" width="232" height="64" rx="10" fill="#fbeadd" stroke="#b4541a" stroke-width="2"/>
<text x="144" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Лимит кончился или чат</text>
<text x="144" y="89" text-anchor="middle" font-weight="700" fill="#1f2a33">переполнен</text>
<rect x="28" y="214" width="232" height="115" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<text x="144" y="238" text-anchor="middle" font-weight="700" fill="#1f2a33">Запись состояния</text>
<text x="144" y="259" text-anchor="middle" font-size="14" fill="#3a4550">карточка задачи в базе;</text>
<text x="144" y="277" text-anchor="middle" font-size="14" fill="#3a4550">для кода ещё карточка</text>
<text x="144" y="295" text-anchor="middle" font-size="14" fill="#3a4550">операции и файл передачи;</text>
<text x="144" y="313" text-anchor="middle" font-size="14" fill="#3a4550">могла быть неполной</text>
<rect x="28" y="384" width="232" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="144" y="408" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы пишете в другой чат</text>
<text x="144" y="429" text-anchor="middle" font-size="14" fill="#3a4550">«продолжи то, что делали»;</text>
<text x="144" y="447" text-anchor="middle" font-size="14" fill="#3a4550">команды и номера не нужны</text>
<rect x="28" y="554" width="232" height="136" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<text x="144" y="578" text-anchor="middle" font-weight="700" fill="#1f2a33">Помощник находит и</text>
<text x="144" y="599" text-anchor="middle" font-weight="700" fill="#1f2a33">сверяет запись</text>
<text x="144" y="620" text-anchor="middle" font-size="14" fill="#3a4550">карточка и файлы, не</text>
<text x="144" y="638" text-anchor="middle" font-size="14" fill="#3a4550">память старого чата; если</text>
<text x="144" y="656" text-anchor="middle" font-size="14" fill="#3a4550">записи нет или она</text>
<text x="144" y="674" text-anchor="middle" font-size="14" fill="#3a4550">устарела — говорит об этом</text>
<rect x="28" y="724" width="232" height="100" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<text x="144" y="748" text-anchor="middle" font-weight="700" fill="#1f2a33">Продолжает или уточняет</text>
<text x="144" y="769" text-anchor="middle" font-weight="700" fill="#1f2a33">у вас</text>
<text x="144" y="790" text-anchor="middle" font-size="14" fill="#3a4550">кому продолжать и сколько</text>
<text x="144" y="808" text-anchor="middle" font-size="14" fill="#3a4550">ждать, решают помощники</text>
<rect x="28" y="894" width="460" height="101" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="902" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="915" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="258" y="938" text-anchor="middle" font-weight="700" fill="#1f2a33">Codex может писать в открытую сессию Claude</text>
<text x="258" y="959" text-anchor="middle" font-size="14" fill="#3a4550">через удалённое управление по вашей ссылке; проверено</text>
<text x="258" y="977" text-anchor="middle" font-size="14" fill="#3a4550">13 сентября</text>
<rect x="28" y="1064" width="460" height="101" rx="10" fill="#fff6d6" stroke="#b8860b" stroke-width="2"/>
<rect x="38" y="1072" width="89.92" height="18" rx="9" fill="#b4541a"/>
<text x="82.96000000000001" y="1085" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Не проверено</text>
<text x="258" y="1108" text-anchor="middle" font-weight="700" fill="#1f2a33">Продолжение из терминала и без вас</text>
<text x="258" y="1129" text-anchor="middle" font-size="14" fill="#3a4550">команда возобновления чужой сессии и автоматическое</text>
<text x="258" y="1147" text-anchor="middle" font-size="14" fill="#3a4550">продолжение не проверялись</text>
</svg>