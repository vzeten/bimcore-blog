<path d="M 832 262.9 L 818 262.9 L 818 280.9 L 804 280.9" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-articles-arr)"/>
<rect x="28" y="44" width="240" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="148" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы просите статью</text>
<text x="148" y="89" text-anchor="middle" font-size="14" fill="#3a4550">написать, поправить,</text>
<text x="148" y="107" text-anchor="middle" font-size="14" fill="#3a4550">перевести</text>
<rect x="296" y="44" width="240" height="122" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="306" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="332.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="416" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Исполнитель пишет файл</text>
<text x="416" y="109" text-anchor="middle" font-weight="700" fill="#1f2a33">на место</text>
<text x="416" y="130" text-anchor="middle" font-size="14" fill="#3a4550">если окно редактора</text>
<text x="416" y="148" text-anchor="middle" font-size="14" fill="#3a4550">закрыто, сам его открывает</text>
<rect x="564" y="44" width="240" height="119" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="574" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="600.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="684" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Файл в рабочей папке</text>
<text x="684" y="109" text-anchor="middle" font-size="14" fill="#3a4550">C:\My_code\bimcore-blog ·</text>
<text x="684" y="127" text-anchor="middle" font-size="14" fill="#3a4550">blog\ · docs\ · i18n\ ·</text>
<text x="684" y="145" text-anchor="middle" font-size="14" fill="#3a4550">ветка main</text>
<rect x="832" y="44" width="240" height="101" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="842" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="868.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="952" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Окно редактора</text>
<text x="952" y="109" text-anchor="middle" font-size="14" fill="#3a4550">localhost:4780; читает</text>
<text x="952" y="127" text-anchor="middle" font-size="14" fill="#3a4550">статьи из рабочей папки</text>
<rect x="832" y="223.4" width="240" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="952" y="247.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы смотрите и правите</text>
<text x="952" y="268.4" text-anchor="middle" font-size="14" fill="#3a4550">по ссылке на статью в окне</text>
<text x="952" y="286.4" text-anchor="middle" font-size="14" fill="#3a4550">редактора</text>
<rect x="564" y="223.4" width="240" height="115" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="684" y="247.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Разрешаете публикацию</text>
<text x="684" y="268.4" text-anchor="middle" font-size="14" fill="#3a4550">кнопкой или словами</text>
<text x="684" y="286.4" text-anchor="middle" font-size="14" fill="#3a4550">«опубликуй: …»; без</text>
<text x="684" y="304.4" text-anchor="middle" font-size="14" fill="#3a4550">разрешения на сайт ничего</text>
<text x="684" y="322.4" text-anchor="middle" font-size="14" fill="#3a4550">не уходит</text>
<rect x="28" y="223.4" width="460" height="104" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="231.4" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="244.4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="258" y="267.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Состояние статьи: скрыта · по ссылке · видна</text>
<text x="258" y="288.4" text-anchor="middle" font-weight="700" fill="#1f2a33">всем</text>
<text x="258" y="309.4" text-anchor="middle" font-size="14" fill="#3a4550">меняется только по вашему указанию</text>
</svg>