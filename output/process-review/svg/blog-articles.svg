<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 367" width="1100" height="367" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Где статьи и как они доходят до сайта">
<defs><marker id="blog-articles-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="1100" height="367" fill="#ffffff"/>
<path d="M 268 83.5 L 282 83.5 L 282 105 L 296 105" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-articles-arr)"/>
<path d="M 536 105 L 564 103.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-articles-arr)"/>
