<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 371" width="1100" height="371" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Как меняем редактор">
<defs><marker id="blog-editor-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="1100" height="371" fill="#ffffff"/>
<path d="M 268 83.5 L 282 83.5 L 282 103.5 L 296 103.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-editor-arr)"/>
<path d="M 536 103.5 L 564 103.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-editor-arr)"/>
<path d="M 804 103.5 L 818 103.5 L 818 83.5 L 832 83.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-editor-arr)"/>
<path d="M 952 123 L 952 223.4" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-editor-arr)"/>
<path d="M 832 273.9 L 818 273.9 L 818 282.9 L 804 282.9" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-editor-arr)"/>
<path d="M 564 282.9 L 550 282.9 L 550 262.9 L 536 262.9" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#blog-editor-arr)"/>
<path d="M 296 262.9 L 282 262.9 L 282 282.9 L 268 282.9" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#blog-editor-arr)"/>
<rect x="28" y="44" width="240" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="148" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы одобрили доработку</text>
<text x="148" y="89" text-anchor="middle" font-size="14" fill="#3a4550">это и есть разрешение на</text>
<text x="148" y="107" text-anchor="middle" font-size="14" fill="#3a4550">одну ветку и одну копию</text>
<rect x="296" y="44" width="240" height="119" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="306" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="332.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="416" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Ветка и временная копия</text>
<text x="416" y="109" text-anchor="middle" font-size="14" fill="#3a4550">fix/editor-… от editor;</text>
<text x="416" y="127" text-anchor="middle" font-size="14" fill="#3a4550">копия внутри папки; пробный</text>
<text x="416" y="145" text-anchor="middle" font-size="14" fill="#3a4550">адрес на своём порту</text>
<rect x="564" y="44" width="240" height="119" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="574" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="600.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="684" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Claude пишет и проверяет</text>
<text x="684" y="109" text-anchor="middle" font-size="14" fill="#3a4550">при его лимите замена по</text>
<text x="684" y="127" text-anchor="middle" font-size="14" fill="#3a4550">правилу; контроль по риску,</text>
<text x="684" y="145" text-anchor="middle" font-size="14" fill="#3a4550">если можно потерять данные</text>
<rect x="832" y="44" width="240" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="952" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы пробуете</text>
<text x="952" y="89" text-anchor="middle" font-size="14" fill="#3a4550">на пробном адресе;</text>
<text x="952" y="107" text-anchor="middle" font-size="14" fill="#3a4550">«принято» или что не так</text>
<rect x="832" y="223.4" width="240" height="101" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="842" y="231.4" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="868.48" y="244.4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="952" y="267.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Перенос в editor</text>
<text x="952" y="288.4" text-anchor="middle" font-size="14" fill="#3a4550">копия accepted-editor</text>
<text x="952" y="306.4" text-anchor="middle" font-size="14" fill="#3a4550">внутри папки; только вперёд</text>
<rect x="564" y="223.4" width="240" height="119" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="574" y="231.4" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="600.48" y="244.4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="684" y="267.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Рабочее окно 4780</text>
<text x="684" y="288.4" text-anchor="middle" font-size="14" fill="#3a4550">запущено из</text>
<text x="684" y="306.4" text-anchor="middle" font-size="14" fill="#3a4550">accepted-editor; статьи</text>
<text x="684" y="324.4" text-anchor="middle" font-size="14" fill="#3a4550">читает из рабочей папки</text>
<rect x="296" y="223.4" width="240" height="79" rx="10" fill="#fbeadd" stroke="#b4541a" stroke-width="2"/>
<text x="416" y="247.4" text-anchor="middle" font-weight="700" fill="#1f2a33">В копии осталась работа?</text>
<text x="416" y="268.4" text-anchor="middle" font-size="14" fill="#3a4550">да — стоп и сообщить вам;</text>
<text x="416" y="286.4" text-anchor="middle" font-size="14" fill="#3a4550">нет — удалить копию и ветку</text>
<rect x="28" y="223.4" width="240" height="119" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<rect x="38" y="231.4" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="244.4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="148" y="267.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Выпуск editor → main</text>
<text x="148" y="288.4" text-anchor="middle" font-size="14" fill="#3a4550">только по вашему отдельному</text>
<text x="148" y="306.4" text-anchor="middle" font-size="14" fill="#3a4550">слову; «принято» этого не</text>
<text x="148" y="324.4" text-anchor="middle" font-size="14" fill="#3a4550">означает</text>
<rect x="914.76" y="163.2" width="74.48" height="20" rx="4" fill="#ffffff" stroke="#e1e5ea"/>
<text x="952" y="177.2" text-anchor="middle" font-size="12" fill="#3a4550">«принято»</text>
</svg>