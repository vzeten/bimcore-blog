<text x="144" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Ваше разрешение</text>
<text x="144" y="89" text-anchor="middle" font-size="14" fill="#3a4550">кнопка в редакторе или</text>
<text x="144" y="107" text-anchor="middle" font-size="14" fill="#3a4550">«опубликуй: список</text>
<text x="144" y="125" text-anchor="middle" font-size="14" fill="#3a4550">статей»; одно разрешение</text>
<text x="144" y="143" text-anchor="middle" font-size="14" fill="#3a4550">на весь список</text>
<rect x="28" y="214" width="232" height="140" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="222" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="258" text-anchor="middle" font-weight="700" fill="#1f2a33">Редактор собирает</text>
<text x="144" y="279" text-anchor="middle" font-weight="700" fill="#1f2a33">состав</text>
<text x="144" y="300" text-anchor="middle" font-size="14" fill="#3a4550">только эта статья и её</text>
<text x="144" y="318" text-anchor="middle" font-size="14" fill="#3a4550">файлы; код редактора и</text>
<text x="144" y="336" text-anchor="middle" font-size="14" fill="#3a4550">соседние статьи не уезжают</text>
<rect x="28" y="384" width="232" height="83" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="392" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="428" text-anchor="middle" font-weight="700" fill="#1f2a33">GitHub · ветка main</text>
<text x="144" y="449" text-anchor="middle" font-size="14" fill="#3a4550">запись поверх свежей main</text>
<rect x="28" y="554" width="232" height="119" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="562" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="575" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="598" text-anchor="middle" font-weight="700" fill="#1f2a33">Сборка на GitHub</text>
<text x="144" y="619" text-anchor="middle" font-size="14" fill="#3a4550">зелёная → выкладка;</text>
<text x="144" y="637" text-anchor="middle" font-size="14" fill="#3a4550">красная → сайт остаётся</text>
<text x="144" y="655" text-anchor="middle" font-size="14" fill="#3a4550">прежним</text>
<rect x="28" y="724" width="232" height="83" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="732" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="745" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="144" y="768" text-anchor="middle" font-weight="700" fill="#1f2a33">Сайт обновлён</text>
<text x="144" y="789" text-anchor="middle" font-size="14" fill="#3a4550">обычно через 2–5 минут</text>
<rect x="28" y="894" width="460" height="101" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="902" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="915" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="258" y="938" text-anchor="middle" font-weight="700" fill="#1f2a33">Проверка после выкладки</text>
<text x="258" y="959" text-anchor="middle" font-size="14" fill="#3a4550">страница открывается; оставшиеся местные отличия</text>
<text x="258" y="977" text-anchor="middle" font-size="14" fill="#3a4550">перечислены, не стёрты</text>
