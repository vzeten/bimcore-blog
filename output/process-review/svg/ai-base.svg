<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 353" width="1100" height="353" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Как ведётся база">
<defs><marker id="ai-base-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="1100" height="353" fill="#ffffff"/>
<path d="M 268 103.5 L 282 103.5 L 282 112.5 L 296 112.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-base-arr)"/>
<path d="M 536 112.5 L 564 114" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-base-arr)"/>
<path d="M 804 114 L 818 114 L 818 92.5 L 832 92.5" fill="none" stroke="#5b6770" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ai-base-arr)"/>
<rect x="28" y="44" width="240" height="119" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="38" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="148" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Новые записи</text>
<text x="148" y="109" text-anchor="middle" font-size="14" fill="#3a4550">идея, факт, решение — сразу</text>
<text x="148" y="127" text-anchor="middle" font-size="14" fill="#3a4550">во входящие базы, с датой и</text>
<text x="148" y="145" text-anchor="middle" font-size="14" fill="#3a4550">автором</text>
<rect x="296" y="44" width="240" height="137" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="306" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="332.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="416" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Сверка с принятым</text>
<text x="416" y="109" text-anchor="middle" font-size="14" fill="#3a4550">старое предложение не</text>
<text x="416" y="127" text-anchor="middle" font-size="14" fill="#3a4550">отменяет новое решение;</text>
<text x="416" y="145" text-anchor="middle" font-size="14" fill="#3a4550">догадка помощника не</text>
<text x="416" y="163" text-anchor="middle" font-size="14" fill="#3a4550">отменяет ваше</text>
<rect x="564" y="44" width="240" height="140" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<rect x="574" y="52" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="600.48" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="684" y="88" text-anchor="middle" font-weight="700" fill="#1f2a33">Сохранить нужное, убрать</text>
<text x="684" y="109" text-anchor="middle" font-weight="700" fill="#1f2a33">дубль</text>
<text x="684" y="130" text-anchor="middle" font-size="14" fill="#3a4550">обратимо: исходная строка</text>
<text x="684" y="148" text-anchor="middle" font-size="14" fill="#3a4550">остаётся, пока размещение</text>
<text x="684" y="166" text-anchor="middle" font-size="14" fill="#3a4550">не подтверждено</text>
<rect x="832" y="44" width="240" height="97" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="952" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Конфликт — вам</text>
<text x="952" y="89" text-anchor="middle" font-size="14" fill="#3a4550">только при неясности, один</text>
<text x="952" y="107" text-anchor="middle" font-size="14" fill="#3a4550">вопрос; обе записи</text>
<text x="952" y="125" text-anchor="middle" font-size="14" fill="#3a4550">сохраняются</text>
<rect x="296" y="223.4" width="460" height="101" rx="10" fill="#fff6d6" stroke="#b8860b" stroke-width="2"/>
<rect x="306" y="231.4" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="332.48" y="244.4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="526" y="267.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Старый завал: 66 сохранённых пунктов убраны</text>
<text x="526" y="288.4" text-anchor="middle" font-size="14" fill="#3a4550">спорные и открытые записи остались; разбирает один</text>
<text x="526" y="306.4" text-anchor="middle" font-size="14" fill="#3a4550">помощник порциями до 10; ночной автоматики нет</text>
</svg>