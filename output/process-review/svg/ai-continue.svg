<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Segoe UI, Arial, sans-serif" font-size="16" role="img" aria-label="Лимит или новый чат">
<defs><marker id="ai-continue-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6770"/></marker></defs>
<rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
<path d="M 268 76 L 282 76 L 282 101.5 L 296 101.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-continue-arr)"/>
<path d="M 536 101.5 L 550 101.5 L 550 83.5 L 564 83.5" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-continue-arr)"/>
<path d="M 804 83.5 L 818 83.5 L 818 112 L 832 112" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-continue-arr)"/>
<path d="M 952 180 L 952 237.2" fill="none" stroke="#5b6770" stroke-width="2" marker-end="url(#ai-continue-arr)"/>
<rect x="28" y="44" width="240" height="64" rx="10" fill="#fbeadd" stroke="#b4541a" stroke-width="2"/>
<text x="148" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Лимит кончился или чат</text>
<text x="148" y="89" text-anchor="middle" font-weight="700" fill="#1f2a33">переполнен</text>
<rect x="296" y="44" width="240" height="115" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<text x="416" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Запись состояния</text>
<text x="416" y="89" text-anchor="middle" font-size="14" fill="#3a4550">карточка задачи в базе; для</text>
<text x="416" y="107" text-anchor="middle" font-size="14" fill="#3a4550">кода ещё карточка операции</text>
<text x="416" y="125" text-anchor="middle" font-size="14" fill="#3a4550">и файл передачи; могла быть</text>
<text x="416" y="143" text-anchor="middle" font-size="14" fill="#3a4550">неполной</text>
<rect x="564" y="44" width="240" height="79" rx="10" fill="#e4ecfb" stroke="#1257d6" stroke-width="2.5"/>
<text x="684" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Вы пишете в другой чат</text>
<text x="684" y="89" text-anchor="middle" font-size="14" fill="#3a4550">«продолжи то, что делали»;</text>
<text x="684" y="107" text-anchor="middle" font-size="14" fill="#3a4550">команды и номера не нужны</text>
<rect x="832" y="44" width="240" height="136" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<text x="952" y="68" text-anchor="middle" font-weight="700" fill="#1f2a33">Помощник находит и</text>
<text x="952" y="89" text-anchor="middle" font-weight="700" fill="#1f2a33">сверяет запись</text>
<text x="952" y="110" text-anchor="middle" font-size="14" fill="#3a4550">карточка и файлы, не память</text>
<text x="952" y="128" text-anchor="middle" font-size="14" fill="#3a4550">старого чата; если записи</text>
<text x="952" y="146" text-anchor="middle" font-size="14" fill="#3a4550">нет или она устарела —</text>
<text x="952" y="164" text-anchor="middle" font-size="14" fill="#3a4550">говорит об этом</text>
<rect x="832" y="237.2" width="240" height="100" rx="10" fill="#e3f2e9" stroke="#1c7a45" stroke-width="2"/>
<text x="952" y="261.2" text-anchor="middle" font-weight="700" fill="#1f2a33">Продолжает или уточняет</text>
<text x="952" y="282.2" text-anchor="middle" font-weight="700" fill="#1f2a33">у вас</text>
<text x="952" y="303.2" text-anchor="middle" font-size="14" fill="#3a4550">кому продолжать и сколько</text>
<text x="952" y="321.2" text-anchor="middle" font-size="14" fill="#3a4550">ждать, решают помощники</text>
<rect x="28" y="430.4" width="460" height="101" rx="10" fill="#ffffff" stroke="#8a939b" stroke-width="2"/>
<rect x="38" y="438.4" width="52.96" height="18" rx="9" fill="#1c7a45"/>
<text x="64.48" y="451.4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Сейчас</text>
<text x="258" y="474.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Codex может писать в открытую сессию Claude</text>
<text x="258" y="495.4" text-anchor="middle" font-size="14" fill="#3a4550">через удалённое управление по вашей ссылке; проверено</text>
<text x="258" y="513.4" text-anchor="middle" font-size="14" fill="#3a4550">13 сентября</text>
<rect x="564" y="430.4" width="460" height="101" rx="10" fill="#fff6d6" stroke="#b8860b" stroke-width="2"/>
<rect x="574" y="438.4" width="89.92" height="18" rx="9" fill="#b4541a"/>
<text x="618.96" y="451.4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Не проверено</text>
<text x="794" y="474.4" text-anchor="middle" font-weight="700" fill="#1f2a33">Продолжение из терминала и без вас</text>
<text x="794" y="495.4" text-anchor="middle" font-size="14" fill="#3a4550">команда возобновления чужой сессии и автоматическое</text>
<text x="794" y="513.4" text-anchor="middle" font-size="14" fill="#3a4550">продолжение не проверялись</text>
</svg>