# Sveltia CMS config — learn.bimcore.one
# Документация: https://sveltiacms.app/en/docs/
#
# СТРУКТУРА: дублирующие коллекции EN/RU для перевода.
# Sveltia native i18n flow не совместим с Docusaurus i18n структурой (см. decisions),
# поэтому используем явные коллекции с префиксом языка + divider между блоками.
# При выходе Sveltia 1.0 GA — переход на nested + native i18n flow.
#
# ПОРЯДОК КОЛЛЕКЦИЙ внутри каждого блока = порядок sidebar сайта (зафиксировано в decisions).
# Источник правды: docusaurus.config.js (i18n EN+RU) + sidebars.js + _category_.json.
#
# Editor components (CTA / YouTube / Truncate) зарегистрированы в index.html.

backend:
  name: github
  repo: vzeten/bimcore-blog
  branch: main

# Глобальный media — fallback. Folder-коллекции переопределяют на co-location в img/.
media_folder: static/img
public_folder: /img

# Авто-причёсывание имён загружаемых файлов (slugify): убирает пробелы и спецсимволы.
# ЗАЧЕМ: пробел в имени (напр. «Pinnerest 01.png») делает путь невалидным URI →
# Docusaurus роняет сборку ВСЕГО сайта на поле image и картинках тела.
# С этой опцией «Pinnerest 01.png» при загрузке станет «pinnerest-01.png» — без пробела.
# Применяется ко всем медиа-загрузкам (обложки + картинки тела). Дважды проверено 2026-06-02
# (офиц. доки Sveltia + issue #422). См. architecture инвариант 1 / decisions/sveltia.
media_libraries:
  all:
    slugify_filename: true

# ⚠ ВАЖНО: НЕТ top-level `slug:` config с encoding.
# Изначально (2026-05-24) добавил `slug.encoding: ascii` для автотранслитерации Cyrillic,
# но это БЫЛО ОШИБОЧНО — нарушает Docusaurus i18n design (linking по path):
# EN slug `what-is-revit` ≠ RU транслитерированный `chto-takoe-revit` → разные paths →
# Docusaurus не свяжет переводы → broken language switcher + broken hreflang теги.
#
# Правильно: slug между EN и RU ОДИНАКОВЫЙ (Docusaurus by design — slug для всех языков).
# URL различаются только префиксом локали: /lessons/x vs /ru/lessons/x.
# При создании RU-перевода автор вводит slug = тот же что в EN-оригинале (вручную).
# См. decisions «Slug одинаковый между языками — Docusaurus by design».

# ====================================================================
# DRY: общие fields переиспользуются через YAML-якоря.
# Это снижает дублирование между EN и RU коллекциями (одинаковые поля).
# ====================================================================

# === Якорь: поля статьи блога ===
_blog_fields: &blog_fields
  - { label: Заголовок, name: title, widget: string }
  - label: 'Slug (URL-часть)'
    name: slug
    widget: string
    required: true
    pattern: ['^[a-z0-9-]+$', 'Только маленькие латинские буквы, цифры и дефисы. Без пробелов, без русских букв.']
    hint: 'Часть URL после даты. Пример: best-free-revit-families-2026. После публикации менять нельзя (потеря SEO).'
  - { label: 'Описание (SEO)', name: description, widget: text, required: false }
  - { label: Дата, name: date, widget: datetime }
  - label: Авторы
    name: authors
    widget: select
    multiple: true
    required: false
    default: ['ivan']
    options:
      - { label: 'Ivan Zylev', value: 'ivan' }
    hint: 'Выберите автора(ов). Добавить нового: 1) запись в blog/authors.yml + 2) добавить в options здесь.'
  - { label: Теги, name: tags, widget: list, required: false, hint: 'По одному тэгу, Enter после каждого (не через запятую).' }
  - { label: 'Ключевые слова (SEO)', name: keywords, widget: list, required: false, hint: 'SEO-ключи для <meta keywords>. По одному, Enter после каждого. Только для статей блога — у остального можно не заполнять.' }
  - label: 'Снять с публикации'
    name: unlisted
    widget: boolean
    required: false
    default: false
    hint: 'Выключено = статья опубликована (по умолчанию). Включено = скрыта из меню и карты сайта, но доступна по прямой ссылке. Инструмент снятия с публикации без удаления.'
  - { label: Содержание, name: body, widget: markdown }

# === Якорь: поля статьи docs ===
# slug-поле обязательно. Автор вводит просто `install-plugin` (без слэша).
# JavaScript preSave hook в admin/index.html автоматически делает абсолютный slug:
# `install-plugin` → `/help/install-plugin` (на основе folder коллекции).
# Это решает проблему double URL — Docusaurus с абсолютным slug в frontmatter
# делает URL точно = slug, без дубликатов. См. decisions «Абсолютный slug + Sveltia hook».
_docs_fields: &docs_fields
  - { label: Заголовок, name: title, widget: string }
  - label: 'Slug (имя папки = URL)'
    name: slug
    widget: string
    required: true
    pattern: ['^/?[a-z0-9-]+(?:/[a-z0-9-]+)*$', 'Только латиница (a-z), цифры, дефисы. Слэши разрешены для абсолютного пути.']
    hint: 'Вводите коротко (пример: install-plugin). Префикс категории добавится автоматически hook''ом → получится /help/install-plugin. Для RU-перевода — ТОТ ЖЕ slug что в EN-оригинале (НЕ переводить slug — он общий для всех языков).'
  - label: 'Sidebar: метка'
    name: sidebar_label
    widget: string
    required: true
    hint: 'Как статья называется в боковой панели сайта. Префикс "01 " допустим если это нумерованный набор (бизнес-логика). Это видит читатель. Если короткий title — впишите тот же.'
  - label: 'Sidebar: позиция'
    name: sidebar_position
    widget: number
    value_type: int
    required: true
    hint: 'Порядок в боковой панели категории. 10, 20, 30 — меньше = выше. Рекомендую шаг 10 чтобы потом можно было вставить между (15, 25).'
  - { label: 'Описание (SEO)', name: description, widget: text, required: false }
  - label: 'Обложка (og:image)'
    name: image
    widget: image
    required: false
    hint: 'Картинка для превью в соцсетях и поиске. Перетащите файл мышкой — путь пропишется сам. Не обязана совпадать с первой картинкой статьи: можно загрузить отдельный файл (рекомендую назвать cover). Форматы: png, jpg, webp.'
  - label: 'Снять с публикации'
    name: unlisted
    widget: boolean
    required: false
    default: false
    hint: 'Выключено = статья опубликована (по умолчанию). Включено = скрыта из меню и карты сайта, но доступна по прямой ссылке. Инструмент снятия с публикации без удаления.'
  - { label: Содержание, name: body, widget: markdown }

# === Якорь: поля landing-страницы раздела ===
# Landing pages — это index.mdx внутри категории (Docusaurus convention).
# sidebar_label/position для landing pages НЕ нужны: порядок категории определяется _category_.json,
# а sidebar landing'а по дефолту = title. Не добавляем sidebar поля сюда чтобы Sveltia не требовала
# пустых значений (см. decision «Sveltia omit_empty не существует»).
_landing_fields: &landing_fields
  - { label: Заголовок, name: title, widget: string }
  - { label: 'Описание (SEO)', name: description, widget: text, required: false }
  - { label: Содержание, name: body, widget: markdown }

collections:
  # ====================================================================
  # EN — ИСХОДНИКИ (дефолтный язык, без префикса в URL)
  # Порядок = порядок sidebar сайта (Blog → Lessons → Courses → Guides → Help → landings)
  # ====================================================================

  # --- 1. EN Блог ---
  - name: blog
    label: 'EN Блог'
    label_singular: Статья блога
    folder: blog
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *blog_fields

  # --- 2. EN Уроки Revit ---
  - name: lessons
    label: 'EN Уроки Revit'
    label_singular: Урок
    folder: docs/lessons
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 3. EN Revit Interior — Free Course (уроки курса) ---
  - name: revit-interior-free
    label: 'EN Revit Interior — Free Course'
    label_singular: Урок курса
    folder: docs/courses/revit-interior-free
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 4. EN Семейства Revit (Guides → Families) ---
  - name: families
    label: 'EN Семейства Revit'
    label_singular: Гайд по семейству
    folder: docs/guides/families
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 5. EN Плагин BIMCORE (Guides → BIMCORE Plugin) ---
  - name: bimcore-plugin
    label: 'EN Плагин BIMCORE'
    label_singular: Гайд по плагину
    folder: docs/guides/bimcore-plugin
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 6. EN Справка ---
  - name: help
    label: 'EN Справка'
    label_singular: Справочная страница
    folder: docs/help
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 7. EN Главные страницы разделов (landing pages) ---
  # files-коллекция: единый интерфейс для всех landing'ов разделов и курсов.
  # При добавлении нового курса/раздела — разработчик добавляет 1 запись в files.
  - name: section-landings
    label: 'EN Главные страницы разделов'
    files:
      - name: docs-intro
        label: 'Docs — Intro'
        file: docs/intro.mdx
        media_folder: /static/img/intro
        public_folder: /img/intro
        fields: *landing_fields
      - name: families-landing
        label: 'Семейства Revit — главная раздела'
        file: docs/guides/families/index.mdx
        media_folder: ''
        public_folder: ''
        fields: *landing_fields
      - name: bimcore-plugin-landing
        label: 'Плагин BIMCORE — главная раздела'
        file: docs/guides/bimcore-plugin/index.mdx
        media_folder: ''
        public_folder: ''
        fields: *landing_fields
      - name: revit-interior-free-landing
        label: 'Revit Interior — Free Course — главная курса'
        file: docs/courses/revit-interior-free/index.mdx
        media_folder: ''
        public_folder: ''
        fields: *landing_fields

  # ====================================================================
  # DIVIDER — визуальный разделитель между EN и RU блоками
  # ====================================================================
  - divider: true

  # ====================================================================
  # RU — ПЕРЕВОДЫ (структура Docusaurus: i18n/ru/docusaurus-plugin-content-{docs|blog}/current/...)
  # При создании перевода: slug должен совпадать с оригиналом (для linking между языками).
  # Подробности — architecture.md «6️⃣ Создать перевод статьи».
  # ====================================================================

  # --- 8. RU Блог ---
  - name: blog-ru
    label: 'RU Блог'
    label_singular: Статья блога (RU)
    folder: i18n/ru/docusaurus-plugin-content-blog
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *blog_fields

  # --- 9. RU Уроки Revit ---
  - name: lessons-ru
    label: 'RU Уроки Revit'
    label_singular: Урок (RU)
    folder: i18n/ru/docusaurus-plugin-content-docs/current/lessons
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 10. RU Revit Interior — Free Course ---
  - name: revit-interior-free-ru
    label: 'RU Revit Interior — Free Course'
    label_singular: Урок курса (RU)
    folder: i18n/ru/docusaurus-plugin-content-docs/current/courses/revit-interior-free
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 11. RU Семейства Revit ---
  - name: families-ru
    label: 'RU Семейства Revit'
    label_singular: Гайд по семейству (RU)
    folder: i18n/ru/docusaurus-plugin-content-docs/current/guides/families
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 12. RU Плагин BIMCORE ---
  - name: bimcore-plugin-ru
    label: 'RU Плагин BIMCORE'
    label_singular: Гайд по плагину (RU)
    folder: i18n/ru/docusaurus-plugin-content-docs/current/guides/bimcore-plugin
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 13. RU Справка ---
  - name: help-ru
    label: 'RU Справка'
    label_singular: Справочная страница (RU)
    folder: i18n/ru/docusaurus-plugin-content-docs/current/help
    create: true
    path: '{{slug}}/index'
    slug: '{{fields.slug}}'
    media_folder: ''
    public_folder: ''
    extension: mdx
    format: frontmatter
    fields: *docs_fields

  # --- 14. RU Главные страницы разделов ---
  - name: section-landings-ru
    label: 'RU Главные страницы разделов'
    files:
      - name: docs-intro-ru
        label: 'Docs — Intro (RU)'
        file: i18n/ru/docusaurus-plugin-content-docs/current/intro.mdx
        media_folder: /static/img/intro
        public_folder: /img/intro
        fields: *landing_fields
      - name: families-landing-ru
        label: 'Семейства Revit — главная раздела (RU)'
        file: i18n/ru/docusaurus-plugin-content-docs/current/guides/families/index.mdx
        media_folder: ''
        public_folder: ''
        fields: *landing_fields
      - name: bimcore-plugin-landing-ru
        label: 'Плагин BIMCORE — главная раздела (RU)'
        file: i18n/ru/docusaurus-plugin-content-docs/current/guides/bimcore-plugin/index.mdx
        media_folder: ''
        public_folder: ''
        fields: *landing_fields
      - name: revit-interior-free-landing-ru
        label: 'Revit Interior — Free Course — главная курса (RU)'
        file: i18n/ru/docusaurus-plugin-content-docs/current/courses/revit-interior-free/index.mdx
        media_folder: ''
        public_folder: ''
        fields: *landing_fields
