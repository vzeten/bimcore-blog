<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sveltia CMS — bimcore-blog</title>
  </head>
  <body>
    <!-- Sveltia CMS грузится из CDN, никаких npm-зависимостей в проекте -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!--
      Editor Components — кнопки в редакторе для вставки MDX-конструкций
      одной командой (вместо ручного набора).
      Подробности — _log ПП1 (задача #6) и сам код CTA — src/components/CTA.jsx.
    -->
    <script>
      // ============ preSave hook: автоматический префикс к slug для docs ============
      // Автор вводит slug просто: "install-plugin".
      // Hook добавляет префикс категории на основе path entry: → "/help/install-plugin".
      // Это делает slug АБСОЛЮТНЫМ — Docusaurus использует его как полный URL
      // без double URL проблемы (`/help/install-plugin/install-plugin` иначе).
      // Skip для blog (там relative slug в frontmatter работает корректно).
      //
      // ВАЖНО — Sveltia preSave API (отличается от Decap):
      //   handler({author, entry}) где entry — Immutable Map со структурой:
      //     { data: <Immutable frontmatter>, slug: string, path: string,
      //       collection: string (имя коллекции), newRecord: bool, i18n: {...} }
      //   Return — Immutable Map с обновлённым data (.toJS() даёт {data, i18n?}).
      //   Decap-style `entry.get('collection').get('folder')` НЕ работает — collection это строка.
      //   Источник: декомпиляция sveltia-cms.js v0.164 (символы UF/eae/HF), 2026-05-25.
      //   См. decisions.md «Sveltia preSave hook: правильный API» (2026-05-25).
      CMS.registerEventListener({
        name: 'preSave',
        handler: function (params) {
          try {
            var entry = params && params.entry;
            if (!entry || !entry.get) return entry;

            // ============ Удаляем ПУСТОЙ image у любой записи ============
            // Sveltia пишет `image: ''`, когда обложку не выбрали. Docusaurus валидирует
            // frontmatter `image` как URI (allowRelative) и роняет сборку ВСЕГО сайта на
            // пустой строке. Решение: пустой/пробельный image — убираем ключ целиком, тогда
            // работает глобальный og:image из docusaurus.config (`image: 'img/social-card.jpg'`).
            // Делаем ДО blog-skip — касается всех коллекций.
            // Пробелы в ИМЕНИ файла лечит `slugify_filename: true` в config.yml (не здесь).
            // См. decisions/sveltia «Поле обложки image валит сборку» + architecture инвариант 1.
            var d0 = entry.get('data');
            if (d0 && d0.get) {
              var img0 = d0.get('image');
              if (typeof img0 === 'string' && img0.trim() === '') {
                entry = entry.deleteIn(['data', 'image']);
              }
            }

            var path = entry.get('path') || '';
            // Skip blog (relative slug в frontmatter работает без double URL)
            if (path.indexOf('blog/') === 0 || path.indexOf('docusaurus-plugin-content-blog') !== -1) {
              return entry;
            }

            var data = entry.get('data');
            if (!data || !data.get) return entry;

            var slug = data.get('slug');
            if (!slug || typeof slug !== 'string') return entry;
            if (slug.charAt(0) === '/') return entry; // уже абсолютный

            // Извлечь URL prefix из path
            //   "docs/help/foo/index.mdx"                                              → "/help"
            //   "docs/guides/families/01-sockets/index.mdx"                            → "/guides/families"
            //   "i18n/ru/docusaurus-plugin-content-docs/current/help/foo/index.mdx"    → "/help"
            var folder = path
              .replace(/\/[^/]+\/index\.(md|mdx)$/, '')
              .replace(/^i18n\/[a-z]+\/docusaurus-plugin-content-docs\/current\//, '')
              .replace(/^docs\//, '');
            var prefix = '/' + folder;

            var cleanSlug = slug.replace(/^\/+|\/+$/g, '');
            var newSlug = prefix + '/' + cleanSlug;

            // Возвращаем entry с обновлённым data.slug (Immutable.setIn)
            return entry.setIn(['data', 'slug'], newSlug);
          } catch (e) {
            // Не блокируем save при ошибке hook — лучше сохранить с original slug
            // чем потерять контент. Автор увидит double URL в локальном preview и сообщит.
            console.error('[preSave hook] error:', e);
            return params && params.entry;
          }
        }
      });

      // ============ CTA блок ============
      // Вставляет <CTA type="..." />. CTA-компонент глобально зарегистрирован
      // в src/theme/MDXComponents.js — никакой import в .mdx файлах не нужен.
      CMS.registerEditorComponent({
        id: 'cta',
        label: 'CTA блок',
        fields: [
          {
            name: 'type',
            label: 'Тип CTA',
            widget: 'select',
            options: [
              { label: 'Блог: вступить в сообщество', value: 'blog' },
              { label: 'Урок: пройти полный курс', value: 'lesson' },
              { label: 'Курс: задать вопрос сообществу', value: 'course' },
              { label: 'Гайд: посмотреть полный набор семейств', value: 'guide' },
              { label: 'Справка: спросить сообщество', value: 'help' },
            ],
            default: 'blog',
            hint: 'Выберите тип CTA — определяет текст и ссылку из src/components/CTA.jsx',
          },
        ],
        pattern: /<CTA\s+type=["']([^"']+)["']\s*\/>/,
        fromBlock: function (match) {
          return { type: match[1] };
        },
        toBlock: function (data) {
          return '<CTA type="' + data.type + '" />';
        },
        toPreview: function (data) {
          return (
            '<div style="background:#f0f7ff;border:1px solid #b3d4ff;padding:12px;border-radius:6px;margin:8px 0;">' +
            '📢 <strong>CTA-блок</strong> (тип: ' + data.type + ')' +
            '</div>'
          );
        },
      });

      // ============ YouTube видео ============
      // Вставляет <YouTube id="..." title="..." /> — адаптивный 16:9 компонент
      // с ленивой загрузкой плеера (см. src/components/YouTube.jsx).
      // Компонент глобально зарегистрирован в src/theme/MDXComponents.js — import в .mdx не нужен.
      // pattern принимает И новый <YouTube .../>, И старый <iframe ...> (обратная совместимость
      // со статьями, импортированными до перехода на компонент).
      CMS.registerEditorComponent({
        id: 'youtube',
        label: 'YouTube видео',
        fields: [
          {
            name: 'id',
            label: 'YouTube ID видео',
            widget: 'string',
            hint: 'Только ID из URL. Пример: для https://www.youtube.com/watch?v=ifJtfM3LgGg ID = ifJtfM3LgGg',
            pattern: ['^[a-zA-Z0-9_-]+$', 'Только латинские буквы, цифры, подчёркивание и дефис. Без https и параметров.'],
          },
          {
            name: 'title',
            label: 'Подпись (для accessibility)',
            widget: 'string',
            default: 'YouTube video',
            hint: 'Краткое описание видео для screen readers и поисковиков.',
          },
        ],
        // Две формы: новый компонент <YouTube ... /> ИЛИ старый <iframe ...embed/ID...>
        pattern: /(?:<YouTube\s+id=["']([^"']+)["'](?:\s+title=["']([^"']*)["'])?\s*\/>|<iframe[^>]*src="https:\/\/www\.youtube(?:-nocookie)?\.com\/embed\/([^"?]+)[^"]*"[^>]*(?:title="([^"]*)")?[^>]*><\/iframe>)/,
        fromBlock: function (match) {
          // match[1]/match[2] — из <YouTube>, match[3]/match[4] — из <iframe>
          return {
            id: match[1] || match[3] || '',
            title: match[2] || match[4] || 'YouTube video',
          };
        },
        toBlock: function (data) {
          return '<YouTube id="' + data.id + '" title="' + (data.title || 'YouTube video') + '" />';
        },
        toPreview: function (data) {
          // Превью с реальной картинкой-обложкой видео в редакторе Sveltia
          return (
            '<div style="position:relative;aspect-ratio:16/9;background:#000 url(https://i.ytimg.com/vi/' +
            data.id + '/maxresdefault.jpg) center/cover;border-radius:8px;margin:8px 0;display:flex;' +
            'align-items:center;justify-content:center;">' +
            '<span style="background:rgba(33,33,33,0.8);border-radius:14px;padding:8px 18px;color:#fff;font-size:24px;">▶</span>' +
            '<span style="position:absolute;bottom:6px;left:8px;background:rgba(0,0,0,0.6);color:#fff;' +
            'font-size:11px;padding:2px 6px;border-radius:4px;">▶️ ' + (data.title || 'YouTube') + ' · ' + data.id + '</span>' +
            '</div>'
          );
        },
      });

      // ============ Truncate (превью обрыв) ============
      // Вставляет <truncate /> — пустой JSX self-closing тег как маркер.
      // Использован JSX-тег потому что:
      // - Sveltia rich-editor НЕ трогает JSX-теги (не экранирует, бывший баг #14)
      // - MDX парсер валидирует как обычный JSX-элемент
      // - Docusaurus blog plugin распознаёт через `truncateMarker: /<truncate ?\/>/` в config
      // - Зарегистрирован в `src/theme/MDXComponents.js` как `() => null` — не рендерится, маркер
      // См. decisions.md «Truncate-маркер = <truncate /> JSX-тег» (2026-05-23).
      CMS.registerEditorComponent({
        id: 'truncate',
        label: 'Превью / "Read More" разрыв',
        fields: [],
        pattern: /<truncate\s*\/>/,
        fromBlock: function () { return {}; },
        toBlock: function () { return '<truncate />'; },
        toPreview: function () {
          return (
            '<hr style="border-top:2px dashed #999;margin:16px 0;" />' +
            '<small style="color:#666;">↑ Превью статьи (в списке блога) / ↓ Полный текст (на странице статьи)</small>'
          );
        },
      });
    </script>
  </body>
</html>
