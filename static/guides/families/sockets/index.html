<!DOCTYPE html>
<!-- Переадресация старого адреса (ED-060): страницы здесь больше нет, адрес ведёт на её преемника.
     GitHub Pages не умеет серверную 301, поэтому — мгновенный meta refresh (Google считает его постоянной
     переадресацией) и переход скриптом с сохранением ?… и #…. Ссылка относительная: этот файл лежит в static/
     и копируется в каждую локаль, поэтому /ru/… ведёт на русскую статью, /es/… — на испанскую. -->
<html>
<head>
<meta charset="utf-8">
<title>→</title>
<meta http-equiv="refresh" content="0; url=../sockets-for-revit/">
<script>location.replace(new URL('../sockets-for-revit/', location.href).href.split('#')[0] + location.search + location.hash);</script>
</head>
<body><a href="../sockets-for-revit/">../sockets-for-revit/</a></body>
</html>
