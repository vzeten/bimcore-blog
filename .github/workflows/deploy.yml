name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Редактор статей — локальная программа, сайт её не собирает и о ней не знает.
    # Правки в editor/ не должны запускать пересборку и деплой сайта.
    paths-ignore:
      - 'editor/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Тест карты доступности переводов. Отдельно от проверки сборки: аудит
      # пользуется той же картой и её собственную ошибку подтвердил бы как
      # ожидаемое поведение.
      - run: npm test
      # Качество контента. Блокируют: термины Revit, число нумерованных пунктов,
      # порядок сводной таблицы, битые внутренние ссылки, ссылки в заголовках.
      # Стиль печатается предупреждением и сборку не валит (решение владельца 2026-07-26).
      - run: npm run content:check
      - run: npm run build
        env:
          ECWID_PUBLIC_TOKEN: ${{ secrets.ECWID_PUBLIC_TOKEN }}
      # Проверка ГОТОВОЙ сборки. Отсутствие перевода — разрешённое состояние и
      # сборку не валит; поломкой считается, когда непереведённая страница
      # осталась открытой для индексации, попала в sitemap/llms.txt или названа
      # переводом через hreflang. Обратный перекос (noindex у настоящего
      # перевода) ловится тем же прогоном.
      - run: npm run seo:audit
      - name: Add IndexNow verification key
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: printf '%s' "$INDEXNOW_KEY" > "build/$INDEXNOW_KEY.txt"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notify IndexNow
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: node scripts/indexnow-submit.mjs
